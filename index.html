    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <script type="module">
      import RefreshRuntime from "/@react-refresh"
      RefreshRuntime.injectIntoGlobalHook(window)
      window.$RefreshReg$ = () => {}
      window.$RefreshSig$ = () => (type) => type
      window.__vite_plugin_react_preamble_installed__ = true
    </script>

    <script>
      window.initGoogleMaps = function () {
        window.__googleMapsReady = true;
        window.dispatchEvent(new Event('google-maps-ready'));
      };
      window.gm_authFailure = function () {
        window.dispatchEvent(new Event('google-maps-error'));
      };
    </script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDDxYtMR6pGB7_CXs6YLsKR7AU9gjulWUU&libraries=places&callback=initGoogleMaps" async defer></script>
